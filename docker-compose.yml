services:

  postgres:
    image: postgres:16
    container_name: horizonops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: horizonops
      POSTGRES_USER: alenn
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: horizonops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: horizonops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: horizonops-pve-exporter
    restart: unless-stopped
    volumes:
      - ./pve.yml:/etc/prometheus/pve.yml:ro
    ports:
      - "9221:9221"

volumes:
  postgres_data: