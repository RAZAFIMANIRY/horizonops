global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "horizonops-node"
    static_configs:
      - targets:
          - "host.docker.internal:9100"

  - job_name: "proxmox"
    metrics_path: /pve
    params:
      target:
        - 192.168.100.2
    static_configs:
      - targets:
          - "pve-exporter:9221"